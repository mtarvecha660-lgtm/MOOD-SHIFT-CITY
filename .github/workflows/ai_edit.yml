      - name: Run Gemini Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Remove "/ai-edit" command and pass the rest as the prompt
          PROMPT=$(echo "$COMMENT_BODY" | sed 's|^/ai-edit||' | xargs)
          
          if [ -z "$PROMPT" ]; then
            echo "No prompt supplied."
            exit 1
          fi
          
          python ai_editor.py "$PROMPT"
